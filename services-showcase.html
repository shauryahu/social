        <div class="stagegrid">
          <div class="gcard" id="gcard" aria-live="off"><div class="scenes" id="scenes"></div></div>
          <div class="chips" id="chips" role="group" aria-label="Services"></div>
        </div>
        <div class="dots" id="dots" role="group" aria-label="Services"></div>
        <div class="ctrl">
          <button class="cbtn pp" id="pp" type="button" aria-label="Pause autoplay"><svg class="pa" viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg><svg class="pl" viewBox="0 0 12 12"><path d="M3 1.8v8.4L10 6z"/></svg></button>
          <button class="cbtn alt" id="nx" type="button" aria-label="Next service"><svg viewBox="0 0 12 12"><path d="M2 1.8v8.4L8 6zM9 1.8h1.6v8.4H9z"/></svg></button>
        </div>
        <div class="glare"></div>
      </div>
    </div></div>
  </div>

  <div class="grid g" id="grid"></div>
</div>
</section>`;

function init(root){
  var host = root.host;
  var $ = function(s){ return root.querySelector(s); };
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var N = SERVICES.length;
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  var ico = function(s){ return s.replace(/<(path|circle)\b/g, '<$1 pathLength="1"'); };

  var head = $('#head'), winwrap = $('#winwrap'), grid = $('#grid'), tilt = $('#tilt'), screen = $('#screen');
  var gcard = $('#gcard'), cv = $('#cv'), ppBtn = $('#pp'), nxBtn = $('#nx');
  var ctx = cv.getContext ? cv.getContext('2d') : null;

  /* ---------- build from SERVICES ---------- */
  var sc = '', ch = '', dt = '', cd = '', ci = 0;
  SERVICES.forEach(function(s, i){
    var svg = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ico(s.icon) + '</svg>';
    sc += '<div class="scene" data-i="'+i+'" aria-hidden="true"><div class="idx">'+pad(i+1)+' / '+pad(N)+'</div><div class="ico big">'+svg+'</div><h3>'+s.t+'</h3><p>'+s.d+'</p></div>';
    ch += '<button class="chip" type="button" data-i="'+i+'"><span class="ico sm">'+svg+'</span><span>'+s.t+'</span><i class="pf" data-pf="'+i+'"></i></button>';
    dt += '<button class="dotb" type="button" data-i="'+i+'" aria-label="'+s.t+'"><span class="dt"><i class="pf" data-pf="'+i+'"></i></span></button>';
    if (s.card){
      cd += '<div class="cw" style="--i:'+(ci+2)+'"><article class="card" data-s="'+i+'" style="--i:'+(ci+2)+'"><i class="spot"></i><i class="rim"></i><i class="live-rim"></i>'
         + '<div class="ico">'+svg+'</div><h3>'+s.t+'</h3><p>'+s.d+'</p>'
         + '<a class="btn" href="'+s.href+'">'+s.cta+ARROW+'</a></article></div>';
      ci++;
    }
  });
  $('#scenes').innerHTML = sc; $('#chips').innerHTML = ch; $('#dots').innerHTML = dt; grid.innerHTML = cd;

  var scenes = [].slice.call(root.querySelectorAll('.scene'));
  var navs = [].slice.call(root.querySelectorAll('.chip,.dotb'));
  var cards = [].slice.call(root.querySelectorAll('.card'));
  var pfBy = SERVICES.map(function(_, i){ return [].slice.call(root.querySelectorAll('[data-pf="'+i+'"]')); });

  /* ---------- state ---------- */
  var cur = -1, prog = 0, energy = 0, playing = !reduce, timers = [];
  var hoverWin = false, hoverCard = false, focusCard = false;
  var H = SERVICES[0].hue, tH = H, lastH = -99, T = 3, raf = 0, last = 0;
  var tx = 0, ty = 0, cx = 0, cy = 0, wx = 9, wy = 9, go = 0;
  var cw = 2, ch2 = 2, RS = .6;
  var alive = false, visWin = false, io = null, ro = null;
  function later(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }
  var holding = function(){ return hoverWin || hoverCard || focusCard; };

  /* ---------- scene switching ---------- */
  function setPF(i, p){ pfBy[i].forEach(function(el){ el.style.transform = 'scaleX(' + p.toFixed(4) + ')'; }); }
  function goTo(i, byUser){
    if (i === cur) return;
    var prev = cur; cur = i; prog = 0; energy = 1; tH = SERVICES[i].hue;
    gcard.setAttribute('aria-live', byUser ? 'polite' : 'off'); /* autoplay must not spam screen readers */
    scenes.forEach(function(el, k){
      if (k === i){ el.classList.remove('leave'); el.classList.add('on'); el.setAttribute('aria-hidden', 'false'); }
      else if (k === prev){
        el.classList.remove('on'); el.classList.add('leave'); el.setAttribute('aria-hidden', 'true');
        later(function(){ el.classList.remove('leave'); }, 850);
      }
    });
    navs.forEach(function(el){
      var on = +el.getAttribute('data-i') === i;
      el.classList.toggle('on', on);
      if (on) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
    });
    SERVICES.forEach(function(_, k){ setPF(k, 0); });
    cards.forEach(function(c){ c.classList.toggle('live', +c.getAttribute('data-s') === i); });
    gcard.classList.remove('sheen'); void gcard.offsetWidth; gcard.classList.add('sheen');
    if (!raf){ if (reduce) { H = tH; screen.style.setProperty('--h', H); } drawStatic(); }
  }
  navs.forEach(function(el){ el.addEventListener('click', function(){ goTo(+el.getAttribute('data-i'), true); }); });
  nxBtn.addEventListener('click', function(){ goTo((cur + 1) % N, true); });
  ppBtn.addEventListener('click', function(){
    playing = !playing;
    screen.classList.toggle('paused', !playing);
    ppBtn.setAttribute('aria-label', playing ? 'Pause autoplay' : 'Play autoplay');
  });

  /* ---------- aurora (low-res canvas, upscaled by CSS = free softness) ---------- */
  function size(){
    var w = screen.clientWidth, h = screen.clientHeight;
    cw = Math.max(2, Math.round(w * RS)); ch2 = Math.max(2, Math.round(h * RS));
    if (cv.width !== cw || cv.height !== ch2){ cv.width = cw; cv.height = ch2; }
    if (!raf) drawStatic();
  }
  function draw(t){
    if (!ctx) return;
    var w = cw, h = ch2, N2 = 7, k, x;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var amp = 1 + energy * .38;
    for (k = 0; k < N2; k++){
      var f = k / (N2 - 1), hue = H + (k - 3) * 9;           /* narrow spread keeps it purple/violet */
      var base = h * (.2 + .6 * f) + cy * h * .05 * (f - .5) * 4;
      ctx.beginPath();
      for (x = -12; x <= w + 12; x += 10){
        var u = x / w + cx * .03;
        var y = base + Math.sin(u * 3.2 + t * .55 + k * 1.3) * h * .15 * amp
                     + Math.sin(u * 7.1 - t * .9 + k * 2.1) * h * .05
                     + Math.sin(u * 1.5 + t * .3 + k) * h * .1 * amp;
        if (x === -12) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = h * (.05 + .045 * ((k + 1) % 3) / 2);
      ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',85%,' + (46 + 10 * f).toFixed(0) + '%,' + (.14 + .09 * (k % 2)).toFixed(2) + ')';
      ctx.stroke();
      ctx.lineWidth = Math.max(1, h * .006);
      ctx.strokeStyle = 'hsla(' + (hue + 8).toFixed(1) + ',95%,82%,' + (.32 + .1 * (k % 2)).toFixed(2) + ')';
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  function drawStatic(){ draw(T); }

  /* ---------- master loop (runs only while the window is on screen) ---------- */
  function frame(t){
    raf = requestAnimationFrame(frame);
    var dt2 = last ? Math.min(.05, (t - last) / 1000) : .016; last = t;
    if (playing && !holding()){
      prog += dt2 * 1000 / AUTOPLAY_MS;
      if (prog >= 1) goTo((cur + 1) % N, false);
      setPF(cur, Math.min(prog, 1));
    }
    energy *= Math.exp(-dt2 * 1.7);
    var diff = ((tH - H + 540) % 360) - 180;
    H += diff * (1 - Math.exp(-dt2 * 2.4));
    if (Math.abs(H - lastH) > .25){ screen.style.setProperty('--h', H.toFixed(1)); lastH = H; }
    var k = 1 - Math.exp(-dt2 * 7);
    cx += (tx - cx) * k; cy += (ty - cy) * k;
    var gt = hoverWin ? 1 : 0; go += (gt - go) * k;
    if (Math.abs(cx - wx) + Math.abs(cy - wy) > .0005){
      tilt.style.transform = 'perspective(1500px) rotateX(' + (-cy * 5).toFixed(3) + 'deg) rotateY(' + (cx * 7).toFixed(3) + 'deg)';
      screen.style.setProperty('--gx', ((cx + 1) * 50).toFixed(1) + '%');
      screen.style.setProperty('--gy', ((cy + 1) * 50).toFixed(1) + '%');
      wx = cx; wy = cy;
    }
    screen.style.setProperty('--go', go.toFixed(3));
    T += dt2 * (.5 + energy * 1.5);
    draw(T);
  }
  function loopStart(){ if (raf || reduce || !alive || !visWin || document.hidden) return; last = 0; raf = requestAnimationFrame(frame); }
  function loopStop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; last = 0; } }
  function onVis(){ if (document.hidden) loopStop(); else loopStart(); }

  /* ---------- window tilt (mouse only) ---------- */
  if (!reduce){
    winwrap.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') hoverWin = true; });
    winwrap.addEventListener('pointermove', function(e){
      if (e.pointerType !== 'mouse') return;
      var r = winwrap.getBoundingClientRect();
      tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2));
      ty = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - .5) * 2));
    });
    winwrap.addEventListener('pointerleave', function(){ hoverWin = false; tx = 0; ty = 0; });
  }

  /* ---------- cards: spotlight, tilt, magnetic button, link to the showcase ---------- */
  cards.forEach(function(card){
    var idx = +card.getAttribute('data-s'), btn = card.querySelector('.btn'), pend = null, rq = 0, ox = 0, oy = 0;
    function upd(){
      rq = 0; var e = pend; if (!e) return;
      var r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mx', x.toFixed(0) + 'px'); card.style.setProperty('--my', y.toFixed(0) + 'px');
      card.style.setProperty('--rx', ((.5 - y / r.height) * 5).toFixed(2) + 'deg');
      card.style.setProperty('--ry', ((x / r.width - .5) * 6).toFixed(2) + 'deg');
      var b = btn.getBoundingClientRect();
      var dx = e.clientX - (b.left + b.width / 2 - ox), dy = e.clientY - (b.top + b.height / 2 - oy), d = Math.hypot(dx, dy);
      if (d < 120){ var f = (1 - d / 120) * .35; ox = dx * f; oy = dy * f; } else { ox = 0; oy = 0; }
      btn.style.setProperty('--bx', ox.toFixed(1) + 'px'); btn.style.setProperty('--by', oy.toFixed(1) + 'px');
    }
    card.addEventListener('pointerenter', function(e){ if (e.pointerType === 'touch') return; hoverCard = true; goTo(idx, false); });
    card.addEventListener('pointermove', function(e){ if (e.pointerType === 'touch') return; pend = e; if (!rq) rq = requestAnimationFrame(upd); });
    card.addEventListener('pointerleave', function(){
      hoverCard = false; pend = null; ox = 0; oy = 0;
      ['--rx','--ry','--bx','--by'].forEach(function(p){ card.style.removeProperty(p); });
      btn.style.removeProperty('--bx'); btn.style.removeProperty('--by');
    });
    btn.addEventListener('focus', function(){
      var vis = true; try { vis = btn.matches(':focus-visible'); } catch(e){}
      if (vis){ focusCard = true; goTo(idx, true); }
    });
    btn.addEventListener('blur', function(){ focusCard = false; });
    
    /* Smooth in-page scrolling for CTA links */
    btn.addEventListener('click', function(e){
      var href = btn.getAttribute('href');
      if (href && href.startsWith('#') && href.length > 1){
        var target = document.getElementById(href.slice(1));
        if (target){
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
          try { history.pushState(null, '', href); } catch(err){}
        }
      }
    });
  });

  /* ---------- reveal on scroll ---------- */
  var groups = [head, winwrap, grid], inView = [false, false, false];
  function reveal(el){
    if (el.classList.contains('in')) return;
    el.classList.add('in');
    if (el === winwrap) later(function(){ host.classList.add('rdy'); }, 1600);
  }

  goTo(0, false); /* first scene */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (alive) size(); });

  return {
    connect: function(){
      alive = true; host.classList.add('off');
      document.addEventListener('visibilitychange', onVis);
      if ('ResizeObserver' in window){ ro = new ResizeObserver(size); ro.observe(screen); } else { size(); window.addEventListener('resize', size); }
      if ('IntersectionObserver' in window){
        io = new IntersectionObserver(function(es){
          es.forEach(function(e){
            var gi = groups.indexOf(e.target); inView[gi] = e.isIntersecting;
            if (e.isIntersecting && e.intersectionRatio >= .12) reveal(e.target);
          });
          host.classList.toggle('off', !inView.some(Boolean));
          visWin = inView[1];
          if (visWin) loopStart(); else loopStop();
        }, {threshold:[0, .12, .25]});
        groups.forEach(function(g){ io.observe(g); });
      } else {
        groups.forEach(reveal); visWin = true; host.classList.remove('off'); loopStart();
      }
      size();
    },
    disconnect: function(){
      alive = false; loopStop();
      if (io){ io.disconnect(); io = null; }
      if (ro){ ro.disconnect(); ro = null; } else window.removeEventListener('resize', size);
      document.removeEventListener('visibilitychange', onVis);
      timers.forEach(clearTimeout); timers = [];
    }
  };
}

class ServicesShowcase extends HTMLElement{
  connectedCallback(){
    if (!document.getElementById('ss-fonts')){
      var l = document.createElement('link');
      l.id = 'ss-fonts'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap';
      document.head.appendChild(l);
    }
    if (!this._root){
      this._root = this.attachShadow({mode:'open'});
      this._root.innerHTML = TEMPLATE;
      this._api = init(this._root);
    }
    this._api.connect();
  }
  disconnectedCallback(){ if (this._api) this._api.disconnect(); }
}
if (!customElements.get('services-showcase')) customElements.define('services-showcase', ServicesShowcase);
})();
</script>
