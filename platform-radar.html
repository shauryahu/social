.in .orbit{animation:spin var(--d) linear infinite var(--dir)}
.pos{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--s)*var(--r)*-1))}
.cnt{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transform:rotate(calc(var(--a)*-1)) scale(.4);

.app{position:absolute;width:var(--ap);height:var(--ap);left:calc(var(--ap)/-2);top:calc(var(--ap)/-2);will-change:transform}

.tile{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;border-radius:22%;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;

.blip .tile{transform:scale(1.16)}
.blip .tile::after{border-color:rgba(167,139,250,.95);box-shadow:0 0 28px rgba(139,124,246,.75)}
.hot .tile{transform:scale(1.2)}
.hot .tile::after{border-color:rgba(167,139,250,.75);box-shadow:0 0 24px rgba(139,124,246,.55)}
.hot .tile:active,.tile:active{transform:scale(1.08)}
.tile:focus-visible{outline:2px solid #0a0a0a;outline-offset:8px}

.core{position:absolute;left:50%;top:50%;width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);border-radius:27%;display:grid;place-items:center;pointer-events:auto;border:0;padding:0;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;

  box-shadow:0 20px 44px -14px rgba(10,12,20,.45),0 0 0 calc(var(--cs)*.09) rgba(255,255,255,.45),0 0 0 calc(var(--cs)*.1) rgba(10,12,20,.06),inset 0 1px 0 #fff;

.core img{width:58%;height:58%;object-fit:contain;display:block;pointer-events:none}
.core.rdy{transition:transform .5s var(--spring)}
.core.rdy:active{transform:scale(.92)}
@media (hover:hover){.core.rdy:hover{transform:scale(1.05)}}
.core:focus-visible{outline:2px solid #0a0a0a;outline-offset:12px}

/* one-shot radar scan: wavy rings + one beam turn, all driven by element.animate and removed when done */
.scan{position:absolute;inset:0;pointer-events:none}
.scan svg{position:absolute;left:50%;top:50%;width:calc(var(--s)*1.1);height:calc(var(--s)*1.1);margin:calc(var(--s)*-.55) 0 0 calc(var(--s)*-.55);overflow:visible;opacity:0;will-change:transform,opacity}

.scan .m{stroke:rgba(139,124,246,.9)}
.scan .b{stroke:rgba(167,139,250,.18)}
.scan .f{fill:rgba(139,124,246,.05)}
.scanbeam{position:absolute;inset:5%;border-radius:50%;opacity:0;will-change:transform,opacity;
  background:conic-gradient(from 0deg,rgba(139,124,246,0) 0deg,rgba(139,124,246,0) 270deg,rgba(139,124,246,.3) 350deg,rgba(139,124,246,.65) 360deg);

/* caption: outer box reveals, inner pill animates its width so labels never snap */

.pill{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%;padding:11px 22px;border-radius:99px;font-size:14px;white-space:nowrap;transition:width .55s var(--ease)}

@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
.pill b{font-weight:600}
.pill span.s{color:#6b6b6b}
.sw{transition:opacity .35s var(--ease),transform .4s var(--ease),filter .35s var(--ease)}
.sw.out{opacity:0;transform:translateY(5px);filter:blur(4px)}
.rv{opacity:0;transform:translateY(22px) scale(.98);filter:blur(8px);transition:opacity .9s var(--ease),transform 1.05s var(--ease),filter .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}

/* fallback pause for browsers without the Web Animations API */

  .core{transform:none}
  .cnt{transform:rotate(calc(var(--a)*-1))}
  .rv{transform:none}
  .ping{display:none}
