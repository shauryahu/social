/* ================= smooth slider engine ================= */
function Slider(el, opts){
  var th = el.querySelector('.th'), fill = el.querySelector('.fill'), lbl = el.querySelector('.lbl');
  var pad = 6, max = 0, x = 0, drag = false, off = 0, busy = false, raf = 0, anim = 0, want = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  function measure(){ pad = parseFloat(getComputedStyle(el).getPropertyValue('--pad')) || 6; max = Math.max(1, el.clientWidth - th.offsetWidth - pad * 2); }
  function render(px){
    x = px;
    var p = px / max;
    th.style.transform = 'translate3d(' + px.toFixed(2) + 'px,0,0)';
    fill.style.clipPath = 'inset(0 ' + Math.max(0, el.clientWidth - (px + th.offsetWidth + pad)).toFixed(1) + 'px 0 0 round 99px)';
    lbl.style.opacity = Math.max(0, 1 - p * 1.7).toFixed(3);
    lbl.style.transform = 'translate3d(' + (p * 14).toFixed(1) + 'px,0,0)';
    th.setAttribute('aria-valuenow', Math.round(p * 100));
  }
  function ease(t){ return 1 - Math.pow(1 - t, 4); }
  function backEase(t){ var c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function animateTo(to, dur, fn, cb){
    cancelAnimationFrame(anim);
    if (reduce){ render(to); cb && cb(); return; }
    var from = x, t0 = 0;
    (function step(t){
      if (!t0) t0 = t;
      var k = Math.min(1, (t - t0) / dur);
      render(from + (to - from) * fn(k));
      if (k < 1) anim = requestAnimationFrame(step); else cb && cb();
    })(performance.now());
  }
  function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

  function down(e){
    if (busy || e.button > 0) return;
    cancelAnimationFrame(anim); measure();
    drag = true; off = e.clientX - x; el.classList.add('drag'); el.classList.remove('nudge');
    try { th.setPointerCapture(e.pointerId); } catch(_){}
    buzz(6);
  }
  function move(e){
    if (!drag) return;
    want = e.clientX - off;
    if (!raf) raf = requestAnimationFrame(function(){
      raf = 0;
      /* light rubber-band at the far end so it never feels like a hard wall */
      var v = want < 0 ? want * .25 : want > max ? max + (want - max) * .15 : want;
      render(Math.max(-8, Math.min(max + 8, v)));
    });
  }
  function up(){
    if (!drag) return;
    drag = false; el.classList.remove('drag');
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    if (x >= max * .85) finish(); else animateTo(0, 650, backEase, function(){ el.classList.add('nudge'); });
  }
  function finish(){
    busy = true; el.classList.add('done'); buzz(14);
    animateTo(max, 260, ease, function(){ opts.onDone && opts.onDone(api); });
  }
  var api = {
    reset: function(delay){
      setTimeout(function(){
        el.classList.remove('done');
        animateTo(0, 700, ease, function(){ busy = false; el.classList.add('nudge'); });
      }, delay || 0);
    },
    fail: function(){
      el.classList.remove('done');
      el.classList.add('shake'); buzz([20, 40, 20]);
      setTimeout(function(){ el.classList.remove('shake'); }, 520);
      animateTo(0, 600, backEase, function(){ busy = false; el.classList.add('nudge'); });
    },
    measure: measure
  };
  th.addEventListener('pointerdown', down);
  th.addEventListener('pointermove', move);
  th.addEventListener('pointerup', up);
  th.addEventListener('pointercancel', up);
  th.addEventListener('keydown', function(e){
    if (busy) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); measure(); finish(); }
  });
  /* a plain tap nudges the knob so the control explains itself */
  th.addEventListener('click', function(e){
    if (busy || e.detail === 0 || x > 2) return;
    measure(); animateTo(Math.min(max * .3, 46), 260, ease, function(){ animateTo(0, 600, backEase); });
  });
  measure(); render(0);
  return api;
}

function init(root){
  var host = root.host;
  var $ = function(s){ return root.querySelector(s); };
  var wrap = $('#wrap'), chipsEl = $('#chips'), cnt = $('#cnt'), toast = $('#toast');
  var user = $('#user'), brief = $('#brief'), bc = $('#bc');
  var sel = DEFAULT_SELECTED.slice();
  var PLUS = '<svg class="pl" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg><svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  $('#explore').setAttribute('href', SERVICES_HREF);
  $('#explore').addEventListener('click', function(e){
    var href = this.getAttribute('href');
    if (href && href.startsWith('#') && href.length > 1){
      var target = document.getElementById(href.slice(1));
      if (target){
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth' });
        try { history.pushState(null, '', href); } catch(err){}
      }
    }
  });

  chipsEl.innerHTML = SERVICES.map(function(s, i){
    return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="'+(sel.indexOf(i) > -1)+'">'+PLUS+'<span>'+s.replace(/&/g,'&amp;')+'</span></button>';
  }).join('');
  function updCnt(){ cnt.textContent = sel.length + ' selected'; }
  updCnt();
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var i = +b.getAttribute('data-i'), at = sel.indexOf(i);
    if (at > -1) sel.splice(at, 1); else sel.push(i);
    b.setAttribute('aria-pressed', at === -1);
    updCnt();
  });
  brief.addEventListener('input', function(){ bc.textContent = brief.value.length + ' / 1000'; clearErr('f-brief'); });
  user.addEventListener('input', function(){
    user.value = user.value.replace(/^@+/, '').replace(/[^A-Za-z0-9_]/g, '');
    clearErr('f-user');
  });
  function setErr(id){ $('#' + id).classList.add('err'); }
  function clearErr(id){ $('#' + id).classList.remove('err'); }
  function say(t, ok){ toast.textContent = t; toast.classList.toggle('on', !!t); }

  /* slider 1: open the Telegram channel */
  var s1 = Slider($('#s1'), { onDone: function(api){
    window.open('https://t.me/' + TG_HANDLE, '_blank', 'noopener');
    api.reset(1600);
  }});

  /* slider 2: validate, then send the case to the Telegram desk */
  var s2 = Slider($('#s2'), { onDone: function(api){
    var ok = true;
    if (!/^[A-Za-z0-9_]{3,32}$/.test(user.value)){ setErr('f-user'); ok = false; }
    if (brief.value.trim().length < 15){ setErr('f-brief'); ok = false; }
    if (!ok){
      api.fail();
      var first = root.querySelector('.err input, .err textarea'); if (first) first.focus({preventScroll:false});
      say('');
      return;
    }
    var services = sel.map(function(i){ return SERVICES[i]; });
    var text = 'New case from website\nUsername: @' + user.value + '\nServices: ' + (services.join(', ') || 'Not specified') + '\n\n' + brief.value.trim();
    host.dispatchEvent(new CustomEvent('case-submit', { bubbles: true, composed: true, detail: { username: user.value, services: services, brief: brief.value.trim() } }));
    
    /* Background submission to bot API if configured */
    try {
      fetch('/api/telegram-inquiry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegramUsername: user.value,
          selectedServices: services,
          customDetails: brief.value.trim()
        })
      }).catch(function(){});
    } catch(e){}

    say('Case ready. Opening Telegram to send it to our desk…');
    window.open('https://t.me/' + TG_HANDLE + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    api.reset(2200);
    setTimeout(function(){ say(''); }, 5200);
  }});

  /* reveal + pause when off screen */
  var io = null, alive = false;
  function remeasure(){ s1.measure(); s2.measure(); }
  var rt = 0;
  function onResize(){ clearTimeout(rt); rt = setTimeout(remeasure, 120); }
  return {
    connect: function(){
      alive = true; host.classList.add('off');
      window.addEventListener('resize', onResize);
      if ('IntersectionObserver' in window){
        io = new IntersectionObserver(function(es){
          var v = es[es.length - 1].isIntersecting;
          host.classList.toggle('off', !v);
          if (v) wrap.classList.add('in');
        }, { threshold: .1 });
        io.observe(wrap);
      } else { wrap.classList.add('in'); host.classList.remove('off'); }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (alive) remeasure(); });
      setTimeout(remeasure, 60);
    },
    disconnect: function(){
      alive = false;
      if (io){ io.disconnect(); io = null; }
      window.removeEventListener('resize', onResize); clearTimeout(rt);
    }
  };
}

class TelegramDesk extends HTMLElement{
  connectedCallback(){
    if (!document.getElementById('td-fonts')){
      var l = document.createElement('link');
      l.id = 'td-fonts'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap';
      document.head.appendChild(l);
    }
    if (!this._root){
      this._root = this.attachShadow({mode:'open'});
      this._root.innerHTML = TEMPLATE;
      this._api = init(this._root);
    }
    this._api.connect();
  }
  disconnectedCallback(){ if (this._api) this._api.disconnect(); }
}
if (!customElements.get('telegram-desk')) customElements.define('telegram-desk', TelegramDesk);
})();
</script>
