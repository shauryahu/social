<!-- ============================================================
  VERIFICATION SECTION (self-contained, same method as otc-section).
  Styles live in a Shadow DOM, so your site's CSS cannot change it.
  Spacing is built in. Background is transparent so your page gradient shows.

  1) Fonts: Inter is already in your <head> for the OTC section.

  2) Put this tag where the old section was:
  ============================================================ -->
<verification-section></verification-section>

<!-- 3) Put this script once, before </body>: -->
<script>
(function(){
function seal(){
  var p=[],n=120,i,a,r;
  for(i=0;i<n;i++){a=i/n*Math.PI*2;r=44+4.2*Math.cos(a*12);p.push((50+r*Math.cos(a)).toFixed(2)+','+(50+r*Math.sin(a)).toFixed(2));}
  return p.join(' ');
}
var SEAL = seal();
var DATA = {
  Brand:     ['Brand and enterprise', '24–48h', 'Entity verification and trademark'],
  Creator:   ['Creator and public figure', '48–72h', 'Press coverage and notability'],
  Executive: ['Executive and founder', '48–72h', 'ID verification and press coverage']
};
var BADGE = '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b8a6f7"/></linearGradient></defs><polygon points="'+SEAL+'" fill="url(#g)"/><path class="chk" pathLength="1" d="M32 51l12 12 24-26" fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var BADGE_DARK = BADGE.replace('id="g"','id="g2"').replace('url(#g)','url(#g2)');
var CHK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

var TEMPLATE = `
<style>

  display:block;position:relative;overflow:hidden;box-sizing:border-box;width:100%;text-align:left;color:#0a0a0a;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background:transparent;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.orbs{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 160px,#000 calc(100% - 160px),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 160px,#000 calc(100% - 160px),transparent 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none;z-index:0}
.o1{width:380px;height:380px;left:-90px;top:40px;background:rgba(167,139,250,.24)}
.o2{width:420px;height:420px;right:-100px;bottom:-60px;background:rgba(96,78,170,.22)}
.o3{width:220px;height:220px;left:38%;top:10px;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,255,255,.4) 50%,transparent 70%)}
.wrap{
  position:relative;z-index:1;max-width:1040px;width:100%;margin:0 auto;box-sizing:border-box;
  padding:calc(56px + env(safe-area-inset-top,0px)) 24px calc(72px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,6vw,72px);align-items:center;
}
@media (min-width:640px){
  .wrap{
    padding:calc(64px + env(safe-area-inset-top,0px)) 36px 80px;
  }
}
@media (min-width:1024px){
  .wrap{
    padding:calc(72px + env(safe-area-inset-top,0px)) clamp(32px,5vw,64px) 88px;
  }
}
.mark{width:56px;height:56px;margin-bottom:22px}
.mark svg,.big svg{display:block;width:100%;height:100%}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:600;max-width:13ch}

.glass{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 28px -16px rgba(10,12,20,.28),inset 0 1px 0 #fff}

.ctaw{margin-top:28px}.cta{display:inline-flex;align-items:center;gap:12px;background:#0a0a0a;color:#fff;border:0;border-radius:999px;padding:12px 12px 12px 24px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.cta span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#0a0a0a;transition:transform .2s}

.cta:focus-visible,.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cta:focus-visible{outline-color:#0a0a0a;outline-offset:3px}
.card{position:relative;border-radius:28px;padding:30px 26px 24px;text-align:center;color:#fff;overflow:hidden;
  background:radial-gradient(120% 55% at 50% -8%,rgba(255,255,255,.16),transparent 60%),radial-gradient(90% 55% at 50% 112%,rgba(139,124,246,.3),transparent 65%),linear-gradient(160deg,rgba(44,46,58,.88),rgba(14,15,21,.93));
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 60px -28px rgba(10,12,20,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.big{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 8px 24px rgba(255,255,255,.18))}

.card .sub{margin-top:6px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.62)}
.tabs{position:relative;margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.tab{appearance:none;-webkit-appearance:none;border:0;height:38px;border-radius:99px;background:transparent;color:rgba(255,255,255,.75);font:600 13.5px Inter,system-ui,sans-serif;cursor:pointer;position:relative;z-index:1;transition:color .4s,transform .35s var(--spring)}
.tab[aria-selected="true"]{color:#14161d}
.info{margin-top:14px;padding:6px 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left}
.info div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.09)}
.info div:first-child{border-top:0}
.info dt{color:rgba(255,255,255,.55)}
.info dd{font-weight:600;text-align:right}
.plats{margin-top:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.plats span{padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(167,139,250,.14);border:1px solid rgba(196,181,253,.3)}
.info div:nth-child(2) dd{color:#cdc2ff}

/* motion */
.rv{opacity:0;transform:translateY(22px) scale(.98);filter:blur(8px);transition:opacity .9s var(--ease),transform 1.05s var(--ease),filter .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.cardw.rv{transform:translateY(30px) scale(.94)}
.in .rv{opacity:1;transform:none;filter:none}
.chk{opacity:0;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s var(--ease) .7s,opacity .2s .7s}
.in .chk{opacity:1;stroke-dashoffset:0}
.mark svg,.big svg{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.orb{animation:drift 20s ease-in-out infinite alternate}
.o2{animation-duration:26s;animation-direction:alternate-reverse}
.o3{animation-duration:16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(46px,32px,0) scale(1.12)}}
.cardw{perspective:1100px}
.card{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .9s var(--spring);will-change:transform}
.card.tilt{transition:transform .12s linear}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(196,181,253,.24),transparent 60%);transition:opacity .5s}
.card.tilt .glare{opacity:1}
.ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 16px)/3);border-radius:99px;background:linear-gradient(180deg,#fff,#e6e0fd);box-shadow:0 4px 14px -4px rgba(120,100,220,.5);transform:translateX(calc(var(--n,0)*(100% + 4px)));transition:transform .6s var(--spring)}
.info dd{transition:opacity .3s var(--ease),transform .4s var(--ease),filter .3s var(--ease)}
.info dd.out{opacity:0;transform:translateY(6px);filter:blur(4px)}
.cta,.feat{transition:transform .5s var(--spring)}
.feat{position:relative;border-color:transparent}
.feat::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.95) 0%,rgba(90,86,120,.26) 38%,rgba(167,139,250,.42) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cta:active{transform:scale(.95)}
.tab:active{transform:scale(.93)}
.feat:active{transform:scale(.97)}
@media (hover:hover){.feat:hover{transform:translateY(-3px) scale(1.02)}.cta:hover{transform:scale(1.03)}}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:40px}.cardw{width:100%;max-width:100%}h1{max-width:none}}
@media (max-width:420px){.feats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none;filter:none}.chk{opacity:1;stroke-dashoffset:0}}
</style>
<div class="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<div class="wrap">
  <div>
    <div class="mark rv" style="--i:0">${BADGE}</div>
    <h1 class="rv" style="--i:1">Build credibility. Strengthen your presence.</h1>
    <p class="lead rv" style="--i:2">SocialAssist gives strategic advice and handles the paperwork for official platform verification. We help public figures, companies and digital brands meet strict notability guidelines on Meta, X, TikTok and global directories.</p>
    <p class="note rv" style="--i:3">Compliance note: platforms decide on official badges at their own discretion. SocialAssist prepares your verified portal submission and PR portfolio and supports you through each step.</p>
    <div class="feats">
      <div class="rv" style="--i:4"><div class="glass feat"><i>${CHK}</i>Official portal submission pathways</div></div>
      <div class="rv" style="--i:5"><div class="glass feat"><i>${CHK}</i>Notability press and media syndication</div></div>
      <div class="rv" style="--i:6"><div class="glass feat"><i>${CHK}</i>Legal trademark documentation support</div></div>
      <div class="rv" style="--i:7"><div class="glass feat"><i>${CHK}</i>Profile metadata optimization</div></div>
    </div>
    <div class="ctaw rv" style="--i:8"><button class="cta" type="button">Explore verification pathways <span>→</span></button></div>
  </div>
  <div class="cardw rv" style="--i:3"><div class="card"><i class="glare"></i>
    <div class="big">${BADGE_DARK}</div>
    <h2>Authoritative verification</h2>
    <p class="sub">Certified presence across Meta, X, TikTok and global platforms</p>
    <div class="tabs" role="tablist" aria-label="Verification type"></div>
    <dl class="info">
      <div><dt>Target category</dt><dd data-k="0"></dd></div>
      <div><dt>Estimated turnaround</dt><dd data-k="1"></dd></div>
      <div><dt>Main prerequisite</dt><dd data-k="2"></dd></div>
    </dl>
    <div class="plats"><span>Meta</span><span>X</span><span>TikTok</span></div>
  </div></div>
</div>`;

function init(root){
  var tabs = root.querySelector('.tabs'), names = Object.keys(DATA), dds = root.querySelectorAll('.info dd');
  var ind = document.createElement('i'); ind.className = 'ind'; tabs.appendChild(ind);
  names.forEach(function(n,i){
    var b = document.createElement('button');
    b.className='tab'; b.type='button'; b.setAttribute('role','tab'); b.textContent=n;
    b.setAttribute('aria-selected', i===0 ? 'true':'false');
    b.addEventListener('click', function(){ pick(n); });
    tabs.appendChild(b);
  });
  function fill(n, first){
    dds.forEach(function(dd,i){
      if (first){ dd.textContent = DATA[n][i]; return; }
      dd.classList.add('out');
      setTimeout(function(){ dd.textContent = DATA[n][i]; dd.classList.remove('out'); }, 180 + i*70);
    });
  }
  function pick(n, first){
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(b){ b.setAttribute('aria-selected', b.textContent===n ? 'true':'false'); });
    tabs.style.setProperty('--n', names.indexOf(n));
    fill(n, first);
  }
  pick(names[0], true);

  var wrap = root.querySelector('.wrap');
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ wrap.classList.add('in'); io.disconnect(); } }, {threshold:.12, rootMargin:'0px 0px -6% 0px'});
    io.observe(wrap);
  } else { wrap.classList.add('in'); }

  var cw = root.querySelector('.cardw'), card = root.querySelector('.card');
  if (window.matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){
    cw.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
      card.style.setProperty('--ry', ((x-.5)*8).toFixed(2)+'deg');
      card.style.setProperty('--rx', ((.5-y)*8).toFixed(2)+'deg');
      card.style.setProperty('--mx', (x*100).toFixed(1)+'%');
      card.style.setProperty('--my', (y*100).toFixed(1)+'%');
      card.classList.add('tilt');
    });
    cw.addEventListener('pointerleave', function(){
      card.classList.remove('tilt');
      card.style.setProperty('--rx','0deg'); card.style.setProperty('--ry','0deg');
    });
  }
}

class VerificationSection extends HTMLElement{
  connectedCallback(){
    if (!this._root){ this._root = this.attachShadow({mode:'open'}); }
    this._root.innerHTML = TEMPLATE;
    init(this._root);
  }
}
if (!customElements.get('verification-section')) customElements.define('verification-section', VerificationSection);
})();
