<!-- ============================================================
  ACCOUNT RESTORATION SECTION (self-contained, same method as the other sections).
  Styles live in a Shadow DOM, so your site's CSS cannot change it.
  Spacing is built in. Background is transparent so your page gradient shows.

  1) Fonts: Inter is already in your <head> for the OTC section.

  2) Put this tag where the old section was:
  ============================================================ -->

<script>

  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 34px 64px -30px rgba(10,12,20,.65),inset 0 1px 0 rgba(255,255,255,.2)}

.stp small{display:block;font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.stp strong{display:block;margin-top:3px;font-size:13.5px;font-weight:600;line-height:1.25;color:inherit}
.stp[aria-selected="true"]{background:rgba(255,255,255,.1);border-color:rgba(196,181,253,.55);color:#fff;box-shadow:0 0 0 3px rgba(167,139,250,.14),0 12px 26px -12px rgba(139,124,246,.75)}
.stp:active{transform:scale(.96)}
.stp:focus-visible{outline:2px solid #fff;outline-offset:2px}
.trk{margin-top:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:33.3%;border-radius:3px;background:linear-gradient(90deg,#fff,#a78bfa);transition:width .9s var(--spring)}
.det{position:relative;overflow:hidden;margin-top:14px;padding:18px;border-radius:18px;background:linear-gradient(160deg,rgba(139,124,246,.18),rgba(255,255,255,.04));border:1px solid rgba(196,181,253,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.scan{position:absolute;top:0;bottom:0;left:-50%;width:40%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.scan.run{animation:scan 1.1s var(--ease)}
@keyframes scan{to{left:125%}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(167,139,250,.2);border:1px solid rgba(196,181,253,.4);color:#e4defc}
.dot{width:7px;height:7px;border-radius:50%;background:#c4b5fd;animation:pulse 1.8s ease-out infinite}

.sw{transition:opacity .45s var(--ease),transform .55s var(--ease),filter .45s var(--ease);transition-delay:calc(var(--k,0)*45ms)}

.chs{display:flex;gap:6px;flex-wrap:wrap}
.chs span{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(167,139,250,.14);border:1px solid rgba(196,181,253,.3)}
/* reveal */
.rv{opacity:0;transform:translateY(22px) scale(.98);filter:blur(8px);transition:opacity .9s var(--ease),transform 1.05s var(--ease),filter .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.cardw.rv{transform:translateY(44px) scale(.92);transition:opacity .8s var(--ease),transform 1.2s cubic-bezier(.34,1.45,.5,1),filter .8s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.in .rv{opacity:1;transform:none;filter:none}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:40px}.cardw{order:0}h1{max-width:none}.copy p.lead,.copy p.note{max-width:none}}

</style>
<div class="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<div class="wrap">
  <div class="copy">
    <p class="tag rv" style="--i:0"><i></i>Rapid account restoration</p>
    <h1 class="rv" style="--i:1">When access stops, assistance starts.</h1>
    <p class="lead rv" style="--i:2">SocialAssist provides specialized escalation for creators, brands and public figures facing account restrictions, unfair suspensions, disabled profiles and compromised access across Instagram, Facebook, TikTok, WhatsApp and X.</p>
    <p class="note rv" style="--i:3">Whether your account was breached by malicious actors, disabled by an automated false positive, or stuck in a 180-day appeal loop, our internal representative channels handle the direct appeals process.</p>
    <div class="feats">
      <div class="rv" style="--i:4"><div class="glass hl feat"><i>${CHK}</i>Disabled and restricted account appeals</div></div>
      <div class="rv" style="--i:5"><div class="glass hl feat"><i>${CHK}</i>Hacked and compromised profile recovery</div></div>
      <div class="rv" style="--i:6"><div class="glass hl feat"><i>${CHK}</i>Permanent 180-day suspension relief</div></div>
      <div class="rv" style="--i:7"><div class="glass hl feat"><i>${CHK}</i>2FA device lockout resolution</div></div>
    </div>
    <div class="ctaw rv" style="--i:8"><button class="cta" type="button">Request account assistance <span>→</span></button></div>
  </div>

  <div class="cardw rv" style="--i:2">
    <div class="win">
      <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="eng">SocialAssist Case Recovery Engine v2.0</div></div>
      <div class="body">
        <div class="prog"><span>Recovery progression</span><b class="sw" data-sw id="cnt"></b></div>
        <div class="steps" role="tablist" aria-label="Recovery steps"></div>
        <div class="trk"><div class="fill"></div></div>

function init(root){
  var $ = function(s){ return root.querySelector(s); };
  var wrap = $('.wrap'), stepsEl = $('.steps'), fillEl = $('.fill'), scan = $('.scan');
  var sw = root.querySelectorAll('[data-sw]');
  sw.forEach(function(el,k){ el.style.setProperty('--k', k); });
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var idx = 0, auto = 0, swT = 0, paused = false, visible = false;

  var btns = STEPS.map(function(s,i){
    var b = document.createElement('button');
    b.type='button'; b.className='stp'; b.setAttribute('role','tab');
    b.innerHTML = '<small>Step 0'+(i+1)+'</small><strong>'+s.title+'</strong>';
    b.addEventListener('click', function(){ stopAuto(); go(i); });
    stepsEl.appendChild(b); return b;
  });
  stepsEl.addEventListener('keydown', function(e){
    if (e.key==='ArrowRight'){ stopAuto(); go(idx+1); btns[idx].focus(); }
    else if (e.key==='ArrowLeft'){ stopAuto(); go(idx-1); btns[idx].focus(); }
  });

  function fill(i){
    var s = STEPS[i];
    $('#cnt').textContent = 'Stage 0'+(i+1)+' of 0'+STEPS.length;
    $('#stt').textContent = s.status; $('#aud').textContent = s.audit; $('#trn').textContent = s.turn;
    $('#ttl').textContent = s.title; $('#dsc').textContent = s.desc;
    btns.forEach(function(b,j){ b.setAttribute('aria-selected', j===i ? 'true':'false'); b.tabIndex = j===i ? 0 : -1; });
    fillEl.style.width = ((i+1)/STEPS.length*100)+'%';
  }
  function go(i){
    if (i < 0 || i >= STEPS.length || i === idx) return;
    var dir = i > idx ? 1 : -1; idx = i;
    sw.forEach(function(el){ el.style.setProperty('--dx', (dir*18)+'px'); el.classList.add('out'); });
    clearTimeout(swT);
    swT = setTimeout(function(){
      fill(idx); sw.forEach(function(el){ el.classList.remove('out'); });
      scan.classList.remove('run'); void scan.offsetWidth; scan.classList.add('run');
    }, reduce ? 0 : 230);
  }
  function stopAuto(){ clearInterval(auto); auto = 0; }
  fill(0);

  var cardw = $('.cardw');
  cardw.addEventListener('pointerenter', function(){ paused = true; });
  cardw.addEventListener('pointerleave', function(){ paused = false; });

  var cta = root.querySelector('.cta');
  if (cta) {
    cta.addEventListener('click', function(){
      var target = document.getElementById('contact');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  }

  function start(){
    wrap.classList.add('in');
    if (!reduce){
      setTimeout(function(){
        auto = setInterval(function(){ if (paused || !visible) return; go((idx+1) % STEPS.length); }, 4200);
      }, 1800);
    }
  }
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      visible = es[0].isIntersecting;
      if (visible && !wrap.classList.contains('in')) start();
    }, {threshold:.15, rootMargin:'0px 0px -6% 0px'});
    io.observe(wrap);
  } else { visible = true; start(); }
}

class RestorationSection extends HTMLElement{
  connectedCallback(){
    if (!this._root){ this._root = this.attachShadow({mode:'open'}); }
    this._root.innerHTML = TEMPLATE;
    init(this._root);
  }
}
if (!customElements.get('restoration-section')) customElements.define('restoration-section', RestorationSection);
})();
</script>
